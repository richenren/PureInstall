[package]
name = "pureinstall"
version = "0.1.0"
description = "A lightweight, clean Windows software installer and manager"
authors = ["PureInstall contributors"]
edition = "2021"

[lib]
name = "pureinstall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
